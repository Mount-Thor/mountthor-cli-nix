name: Update mountthor

# Daily check against https://get.mountthor.com/manifest.json. When upstream's
# per-platform latest advances past our pin, regenerate sources.nix, verify it
# builds, and open a PR.

on:
  schedule:
    # 06:17 UTC — off-the-hour to dodge GitHub's cron stampede.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate sources.nix
        run: ./update.sh

      - name: Inspect diff
        id: diff
        run: |
          if git diff --quiet -- sources.nix; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            version=$(grep -oP 'version = "\K[^"]+' sources.nix)
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v27
        if: steps.diff.outputs.changed == 'true'
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # A PR opened with GITHUB_TOKEN does not trigger `pull_request`
      # workflows, so build.yml will not run against this branch and the
      # `gh pr checks` gate below would wave the bump through on CodeQL alone.
      # That is how 0.3.59 reached main with an installCheckPhase that could
      # not pass. Build the new pin here, before the PR exists.
      # --all-systems also evaluates the platforms this runner cannot build,
      # so a release that ships no artifact for one of them fails here rather
      # than after the merge.
      - name: Verify the bump builds
        if: steps.diff.outputs.changed == 'true'
        run: nix flake check --all-systems --print-build-logs

      - name: Open PR
        id: cpr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto/bump-mountthor
          delete-branch: true
          commit-message: "Bump mountthor to ${{ steps.diff.outputs.version }}"
          title: "Bump mountthor to ${{ steps.diff.outputs.version }}"
          body: |
            Automated update from `https://get.mountthor.com/manifest.json`.

            Release notes: https://github.com/Mount-Thor/mount-thor/releases/tag/mountthor-v${{ steps.diff.outputs.version }}

      - name: Merge
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          # There is nothing to wait on. The verify step above already built
          # this pin, and a PR opened with GITHUB_TOKEN does not trigger
          # `pull_request` workflows, so build.yml never runs on this branch.
          # The old `gh pr checks --watch --fail-fast` gate here both waved
          # bumps through on CodeQL alone and failed the run outright when
          # branch protection refused the merge, which is why this job went
          # red every morning from 2026-09-13 on.
          if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            echo "Merged #$PR_NUMBER."
            exit 0
          fi

          # Branch protection can still refuse, e.g. if a required review is
          # reinstated. Queue the merge rather than failing the cron, so the
          # bump lands when the requirement is met.
          echo "::warning::Direct merge refused for #$PR_NUMBER; enabling auto-merge instead."
          gh pr merge "$PR_NUMBER" --squash --delete-branch --auto
