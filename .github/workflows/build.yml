name: Build

# Upstream reshuffles the CLI surface between patch releases — 0.3.59 replaced
# `mthr --version` with a `version` subcommand and dropped `mthr docs
# completions` / `mthr docs man` — so the package has to be built, not just
# evaluated, before anything lands on main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-14
            system: aarch64-darwin
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # --all-systems evaluates every platform in sources.nix, which catches a
      # missing artifact or a malformed entry, and builds the two variants this
      # runner can actually build. Their installCheckPhase smoke-tests the
      # binary and asserts that the pinned version is the version it reports.
      #
      # x86_64-darwin is only ever evaluated: GitHub retired its Intel macOS
      # runners, so nothing here can build it.
      - run: nix flake check --all-systems --print-build-logs
